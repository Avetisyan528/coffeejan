<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CoffeeJan</title>
  <script>
    (function () {
      var repoBase = window.location.hostname.endsWith('.github.io') ? '/coffeejan' : '';
      var path = window.location.pathname;
      var route = path.indexOf(repoBase) === 0 ? path.slice(repoBase.length) : path;
      var target = repoBase + '/#' + (route || '/') + window.location.search;
      window.location.replace(target);
    }());
  </script>
</head>
<body></body>
</html>
